# calc_ng.py default configuration
# Scenario: 6 storage nodes with 24 HDDs each, 100 Gbit/s server NICs,
# 200 Gbit/s client NICs, EC 5+3.
#
# Run: ./calc_ng.py -c default.ini [-f json]
# Units: NICs in Gbit/s, throughput in MB/s, capacity in GB.
# Comments must be on their own line (no inline comments).
#
# Throughput values are CONSERVATIVE estimates, not peak numbers.


[clients]
# ASSUMPTION: client count and threads are placeholders.
number_clients = 2
number_threads = 8 
capacity_nic_gbs = 15


[storagenodes]
number_nodes = 4
capacity_nic_gbs = 15
number_devices = 4 
number_device_controller = 0

# Write throughput per NVMe in MB/s.
# NVMe attached to n1-standard-8
device_throughput_mbs = 382 
# Read throughput
device_throughput_mbs_read = 601 

# Controller example: Broadcom HBA 9500-16i.
# Datasheet value of 13700 MB/s (sequential read), also used for writes.
#   https://docs.broadcom.com/doc/BC-0510EN
controller_throughput_mbs = 13700

# Capacity per HDD in GB (24 TB).
capacity_devices_GB = 24000


[storageconfig]
# Erasure coding: data and coding stripes.
ec_datastripes = 5
ec_codingstripes = 3

replication_factor = 3
replication_stripewidth = 8
