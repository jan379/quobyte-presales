# calc_ng.py default configuration
# Scenario: 6 storage nodes with 24 HDDs each, 100 Gbit/s server NICs,
# 200 Gbit/s client NICs, EC 5+3.
#
# Run: ./calc_ng.py -c default.ini [-f json]
# Units: NICs in Gbit/s, throughput in MB/s, capacity in GB.
# Comments must be on their own line (no inline comments).
#
# Throughput values are CONSERVATIVE estimates, not peak numbers.


[clients]
# ASSUMPTION: client count and threads are placeholders.
number_clients = 4
number_threads = 8
capacity_nic_gbs = 200


[storagenodes]
number_nodes = 6
capacity_nic_gbs = 100
number_devices = 24
number_device_controller = 1

# HDD example: Seagate Exos X24 24TB.
# Peak value from the official data sheet (DS2080): 285 MB/s sustained, for
# reads and writes alike. This is an outer-track peak and is NOT used here.
#   https://www.seagate.com/content/dam/seagate/nl_nl/content-fragments/products/datasheets/exos-x24/exos-x24-DS2080-2307US-nl_NL.pdf
#
# Conservative values: the lowest whole-disk average among independently
# tested data center drives (Exos X20, Exos M30, Toshiba MG10/MG11), rounded
# down. The Exos X24 itself was not tested this way, so these are estimates.
#   https://www.hardware-mag.de/artikel/festplatten_ssds/seagate_ironwolf_pro_32_tb_nas_hdd_im_test/8/
# Write throughput per HDD in MB/s.
device_throughput_mbs = 217
# Read throughput per HDD in MB/s.
device_throughput_mbs_read = 219

# Controller example: Broadcom HBA 9500-16i.
# Datasheet value of 13700 MB/s (sequential read), also used for writes.
#   https://docs.broadcom.com/doc/BC-0510EN
controller_throughput_mbs = 13700

# Capacity per HDD in GB (24 TB).
capacity_devices_GB = 24000


[storageconfig]
# Erasure coding: data and coding stripes.
ec_datastripes = 5
ec_codingstripes = 3

replication_factor = 3
replication_stripewidth = 1
