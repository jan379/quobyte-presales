# calc_ng.py example configuration: all-flash (NVMe), balanced
# Scenario: 6 storage nodes with 8 NVMe SSDs each, 400 Gbit/s server NICs,
# 12 clients with 200 Gbit/s NICs, EC 5+3.
#
# Balance: devices and network deliver about the same.
#   Per node: 8 SSDs = 44.8 GB/s write, 54.4 GB/s read; NIC = 50 GB/s.
#   Cluster:  storage network 6 x 50 GB/s = 300 GB/s per direction;
#             client network 12 x 25 GB/s = 300 GB/s.
# More SSDs per node would shift the limit to the network, fewer to the SSDs.
#
# Run: ./calc_ng.py -c nvme.ini [-f json]
# Units: NICs in Gbit/s, throughput in MB/s, capacity in GB.
# Comments must be on their own line (no inline comments).


[clients]
# ASSUMPTION: threads are a placeholder. 12 clients make the client network
# match the storage network.
number_clients = 12
number_threads = 8
capacity_nic_gbs = 200


[storagenodes]
number_nodes = 6
# ASSUMPTION: one 400 Gbit/s NIC per node (or equivalent, e.g. 2 x 200).
capacity_nic_gbs = 400
number_devices = 8

# NVMe SSDs attach directly via PCIe, there is no shared HDD controller.
# 0 removes the controller from the calculation.
number_device_controller = 0
controller_throughput_mbs = 0

# SSD example: Micron 7450 PRO 7.68TB (U.3, PCIe 4.0 x4).
# Official data sheet: 6800 MB/s sequential read, 5600 MB/s sequential write.
#   https://www.microncpg.com/products/ssd/micron-7450-ssd
#
# Conservative values: the data sheet figures. Unlike HDD peaks, these are
# not outer-track peaks: an independent steady-state test measured about
# 5750 MB/s sequential write and about 7000 MB/s sequential read, at or above
# the data sheet, so no further derating is applied.
#   https://www.tweaktown.com/reviews/10278/micron-7450-pro-7-68tb-enterprise-ssd-double-density/index.html
# Write throughput per SSD in MB/s.
device_throughput_mbs = 5600
# Read throughput per SSD in MB/s.
device_throughput_mbs_read = 6800

# Capacity per SSD in GB (7.68 TB).
capacity_devices_GB = 7680


[storageconfig]
# Erasure coding: data and coding stripes.
ec_datastripes = 5
ec_codingstripes = 3

replication_factor = 3
replication_stripewidth = 1
