apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: elbencho
  name: elbencho
spec:
  replicas: 4
  selector:
    matchLabels:
      app: elbencho
  template:
    metadata:
      labels:
        app: elbencho
    spec:
      nodeSelector:
        storage-node-pool: quobyte 
      containers:
      - command:
        - /bin/sh
        - -c
        - elbencho --service --foreground
        #image: breuner/elbench
        image: breuner/elbencho:v3.1-11 
        name: elbencho
        volumeMounts:
        - mountPath: /mnt/quobyte-volume
          name: quobyte-backend
      volumes:
      - name: quobyte-backend
        persistentVolumeClaim:
          claimName: test-pvc
