- hosts: localhost
  become: no
  vars:
    bench_dir: "{{ ansible_facts['env']['HOME'] }}/benchmarks"
    hosts_dir: "{{ bench_dir }}/hosts"
  tasks:

    - name: Create benchmark directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ bench_dir }}"
        - "{{ bench_dir }}/results"
        - "{{ bench_dir }}/example_workloads"
        - "{{ hosts_dir }}"

    - name: Create example workloads
      template:
        src: "{{ playbook_dir }}/templates/{{ item }}"
        dest: "{{ bench_dir }}/example_workloads/{{ item }}"
        mode: "0644"
      loop:
        - 4krandomread-layout.elbencho
        - 4krandomread.elbencho
        - Readme.md
        - iops.elbencho
        - localdevice_throughput.elbencho
        - parallel_throughput.elbencho
        - parallel_throughput_singlethread.elbencho
        - singleclient_multithread_throughput.elbencho
        - singleclient_throughput.elbencho
        - smallfiles.elbencho
        - zerobytefiles.elbencho

    # Clients are used for actual storage benchmarks
    - name: Create client list
      copy:
        dest: "{{ hosts_dir }}/elbencho-clients.list"
        content: "{{ groups['clients'] | join('\n') }}\n"
        mode: "0644"

    - name: Create first client file
      copy:
        dest: "{{ hosts_dir }}/elbencho-firstclient.list"
        content: "{{ groups['clients'][0] }}\n"
        mode: "0644"

    - name: Create second client file
      copy:
        dest: "{{ hosts_dir }}/elbencho-secondclient.list"
        content: "{{ groups['clients'][1] }}\n"
        mode: "0644"
      when: groups['clients'] | length > 1

    # All other nodes are used for "netbench"
    - name: Create dataserver list
      copy:
        dest: "{{ hosts_dir }}/elbencho-dataserver.list"
        content: "{{ groups['dataservices'] | join('\n') }}\n"
        mode: "0644"

    - name: Create first dataservice file
      copy:
        dest: "{{ hosts_dir }}/elbencho-firstdataserver.list"
        content: "{{ groups['dataservices'][0] }}\n"
        mode: "0644"

    - name: Create second dataservice file
      copy:
        dest: "{{ hosts_dir }}/elbencho-seconddataserver.list"
        content: "{{ groups['dataservices'][1] }}\n"
        mode: "0644"
      when: groups['dataservices'] | length > 1


- hosts: quobyteservers,clients
  become: yes
  tasks:

    - name: Set architecture specific variables
      set_fact:
        arch: "{{ 'aarch64' if ansible_facts['architecture'] == 'aarch64' else 'x86_64' }}"

    - name: Get elbencho binary archive
      get_url:
        url: "https://github.com/breuner/elbencho/releases/download/v3.0-37/elbencho-static-{{ arch }}.tar.gz"
        dest: /tmp/elbencho.tar.gz
        force: true

    - name: Unpack elbencho archive
      unarchive:
        src: /tmp/elbencho.tar.gz
        remote_src: yes
        dest: /usr/local/bin/
