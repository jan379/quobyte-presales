- hosts: localhost
  become: no 
  tasks:

    - name: Create benchmark directory
      file:
        path: "{{ ansible_env.HOME }}/benchmarks"
        state: directory

    - name: Create benchmark results directory
      file:
        path: "{{ ansible_env.HOME }}/benchmarks/results"
        state: directory

    - name: Create benchmark example directory
      file:
        path: "{{ ansible_env.HOME }}/benchmarks/example_workloads"
        state: directory

    - name: Create example workloads 
      template:
        src: templates/{{ item }}
        dest: "{{ ansible_env.HOME }}/benchmarks/example_workloads/{{ item }}"
      with_items:
        - "parallel_throughput.elbencho"


# Clients are used for actual storage benchmarks
    - name: Create client list
      lineinfile:
        path: "{{ ansible_env.HOME }}/benchmarks/elbencho-clients.list"
        create: true
        line: "{{ item }}"
      with_items: "{{ groups.clients }}"

    - name: Create first client file
      lineinfile:
        path: "{{ ansible_env.HOME }}/benchmarks/elbencho-firstclient.list"
        create: true
        line: "{{ item }}"
      with_items: "{{ groups.clients[0] }}"

    - name: Create second client file
      lineinfile:
        path: "{{ ansible_env.HOME }}/benchmarks/elbencho-secondclient.list"
        create: true
        line: "{{ item }}"
      with_items: "{{ groups.clients[1] }}"
      when: "groups.clients | length  > 1"


# All other nodes are used for "netbench"
    - name: Create dataserver list
      lineinfile:
        path: "{{ ansible_env.HOME }}/benchmarks/elbencho-dataserver.list"
        create: true
        line: "{{ item }}"
      with_items: "{{ groups.dataservices }}"

    - name: Create first dataservice file 
      lineinfile:
        path: "{{ ansible_env.HOME }}/benchmarks/elbencho-firstdataserver.list"
        create: true
        line: "{{ item }}"
      with_items: "{{ groups.dataservices[0] }}"

    - name: Create second dataservice file
      lineinfile:
        path: "{{ ansible_env.HOME }}/benchmarks/elbencho-seconddataserver.list"
        create: true
        line: "{{ item }}"
      with_items: "{{ groups.dataservices[1] }}"


- hosts: quobyteservers,clients 
  become: yes
  tasks:

    - name: Set architecture specific variables
      set_fact:
        arch: "{{ 'aarch64' if ansible_facts.architecture == 'aarch64' else 'x86_64' }}"

    - name: Get elbencho binary archive
      get_url: 
        #url: https://github.com/breuner/elbencho/releases/download/v2.2-5/elbencho-static-x86_64.tar.gz
        #url: https://github.com/breuner/elbencho/releases/download/v3.0-7/elbencho-static-x86_64.tar.gz 
        ##url: https://github.com/breuner/elbencho/releases/download/v3.0-25/elbencho-static-x86_64.tar.gz
        ##url: https://github.com/breuner/elbencho/releases/download/v3.0-25/elbencho-static-{{ arch }}.tar.gz
        # ARM:
        url: https://github.com/breuner/elbencho/releases/download/v3.0-37/elbencho-static-{{ arch }}.tar.gz
        force: true
        dest: /tmp/elbencho.tar.gz

    - name: Unpack elbencho archive
      unarchive:
        src: /tmp/elbencho.tar.gz
        remote_src: yes
        dest: /usr/local/bin/

