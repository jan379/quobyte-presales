- hosts: localhost
  become: yes
  tasks:
    - name: Stop elbencho on clients
      shell:
        cmd: elbencho --quit --hostsfile "{{ ansible_env.HOME }}/benchmarks/elbencho-clients.list

    - name: Stop elbencho on services 
      shell:
        cmd: elbencho --quit --hostsfile "{{ ansible_env.HOME }}/benchmarks/elbencho-dataserver.list

